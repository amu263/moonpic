name: Build debug APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Lint + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          sdk-version: '35'
          build-tools-version: '35.0.0'
          platform-tools-version: '35.0.0'
          ndk-version: '26b'
          cache-modules-cache: true

      - name: Generate gradle wrapper
        # We don't commit gradle-wrapper.jar; generate it on CI once.
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run detekt
        continue-on-error: true
        run: ./gradlew detekt || echo "detekt not configured yet — skipping"

      - name: Run lint
        run: ./gradlew :app:lintDebug || echo "lint warnings — see report"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Locate APK
        id: locate
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"
          ls -la "$(dirname "$APK")"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonpic-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
